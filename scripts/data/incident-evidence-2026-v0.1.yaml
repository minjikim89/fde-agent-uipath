# Incident Evidence 2026 — v0.1
#
# Purpose: citable, source-verified real-world incidents in which an autonomous /
# agentic AI system caused harm, for use as `evidence` in the FDE Agent risk ontology
# (scripts/data/mapping-ontology-v0.1.yaml, v0.4).
#
# Why this file exists: the ontology's existing evidence base leans on AIID incidents
# from 2023-2024 (incident_704, incident_1027, report_7003, incident_748) plus the
# Air Canada / Klarna precedents. Those pre-date the enterprise agent deployment wave.
# This file adds Dec 2025 - Aug 2026 evidence, with emphasis on the ontology's core
# thesis: gating irreversible actions behind human-in-the-loop review.
#
# ── Verification standard (applied strictly) ─────────────────────────────────
#   * Every incident below was checked against at least one credible source that was
#     actually fetched or returned in search results; most have two or more.
#   * Where sources disagree on a date or a number, the disagreement is recorded in
#     `date_note` / `figure_note` rather than silently resolved.
#   * Leads that could not be confirmed were DROPPED and are listed, with the reason,
#     in `dropped_leads` at the bottom. Do not resurrect them without new sourcing.
#   * No URL appears here that was not seen during verification.
# ─────────────────────────────────────────────────────────────────────────────

version: v0.1
last_updated: '2026-08-29'
date_range:
  from: '2025-12-01'
  to: '2026-08-29'
scope_note: >-
  Autonomous / agentic AI systems that caused real-world harm, prioritising enterprise
  workflow contexts. "Agentic" here means the system selected and executed actions
  (tool calls, infrastructure operations, vehicle control, customer-facing statements)
  rather than only producing text for a human to act on. Incidents where the harm was
  caused by a human adversary using AI are out of scope unless agent permissions were
  the amplifying factor.

schema:
  id: slug, stable, referenced from mapping-ontology evidence blocks
  date: ISO date of the incident itself (not of reporting), best available
  system_type: coding_agent | customer_service_agent | booking_agent | autonomous_vehicle_fleet | infrastructure_agent | advisory_agent
  what_happened: 2-3 factual sentences, no interpretation
  harm_type: controlled vocabulary, see harm_type_vocabulary below
  no_attacker: true if an autonomous system caused the harm with no adversary in the chain
  fde_axis: primary FDE Agent axis (general_failure | security | handoff)
  secondary_axes: other axes with material relevance
  sources: URLs verified during collection
  verification: two_sources | single_source_plus_corroboration | primary_database

harm_type_vocabulary:
  - data_destruction          # irreversible deletion of data or infrastructure
  - service_disruption        # outage, degradation, unavailability
  - data_exposure             # confidential or personal data made accessible
  - physical_safety_risk      # risk to persons in the physical world
  - financial_loss            # direct monetary loss
  - regulatory_action         # licence suspension, recall, enforcement
  - misinformation_to_user    # false statement delivered to a customer or operator

# =============================================================================
# INCIDENTS
# =============================================================================

incidents:

  - id: aws-kiro-cost-explorer-outage
    date: '2025-12-15'
    date_note: >-
      AIID records the incident date as 2025-12-15. The Financial Times reported it on
      2026-02-20; Amazon responded publicly on 2026-02-21.
    system_type: coding_agent
    organization: Amazon Web Services
    agent: Kiro (Amazon's agentic coding assistant, launched July 2025)
    what_happened: >-
      AWS engineers deployed Kiro to make infrastructure changes on a live system. According
      to the Financial Times, the agent determined that it needed to delete and recreate the
      environment, and executed that decision, producing roughly 13 hours of AWS Cost Explorer
      service interruption in a mainland China region. Amazon disputed the framing, stating
      the interruption "was the result of user error - specifically misconfigured access
      controls - not AI", and noted the agent held an over-broad role at the time.
    harm_type: [service_disruption, data_destruction]
    no_attacker: true
    fde_axis: security
    secondary_axes: [general_failure]
    axis_rationale: >-
      Maps to OWASP LLM06 Excessive Agency: the agent held operator-level permissions and
      no approval gate stood between it and an irreversible destructive operation. Scored on
      the security axis because the ontology places excessive_autonomy there, but note there
      was no adversary - see the no_attacker_delta section below.
    hitl_gate_present: false
    hitl_note: >-
      Amazon subsequently added senior-engineer sign-off requirements for AI-assisted changes,
      i.e. the remediation was exactly the HITL gate the ontology prescribes.
    aiid_incident_id: 1442
    verification: primary_database
    sources:
      - https://incidentdatabase.ai/cite/1442/
      - https://www.engadget.com/ai/13-hour-aws-outage-reportedly-caused-by-amazons-own-ai-tools-170930190.html
      - https://www.geekwire.com/2026/amazon-pushes-back-on-financial-times-report-blaming-ai-coding-tools-for-aws-outages/

  - id: waymo-school-bus-software-recall
    date: '2025-12-10'
    date_note: >-
      Sources disagree on the recall timeline. CBS News reports the NHTSA recall notice posted
      8 November with vehicles repaired by 17 November; local outlets (KSAT, KXAN) carried the
      recall on 10 December 2025. The NTSB opened its own probe on 23 January 2026, which is
      unambiguously inside this file's window. Treat the recall date as approximate.
    system_type: autonomous_vehicle_fleet
    organization: Waymo
    agent: Waymo 5th-generation Automated Driving System
    what_happened: >-
      Waymo recalled 3,067 vehicles over a software defect that could cause an autonomous
      vehicle to pass a stopped school bus with red lights flashing and stop arm extended.
      Austin ISD recorded roughly 20 illegal-passing incidents during the 2025-2026 school
      year, including one citation issued after Waymo said it had fixed the problem; Atlanta
      schools reported 6 further cases as of 5 December. NHTSA opened a probe in October 2025
      and the NTSB opened its own investigation on 23 January 2026.
    harm_type: [physical_safety_risk, regulatory_action]
    no_attacker: true
    fde_axis: general_failure
    secondary_axes: [handoff]
    axis_rationale: >-
      A decision-automation node failing a hard rule (legal stop obligation) repeatedly and
      silently, with the failure surfaced by an external party rather than by internal
      monitoring. The post-fix recurrence is direct evidence of threshold_drift and of
      remediation verification failure.
    hitl_gate_present: false
    verification: two_sources
    sources:
      - https://www.cbsnews.com/news/waymo-recall-3000-vehicles-software-school-bus/
      - https://techcrunch.com/2026/01/23/waymo-probed-by-national-transportation-safety-board-over-illegal-school-bus-behavior
      - https://www.therobotreport.com/waaymo-recalls-robotaxi-software-after-school-bus-safety-failures/

  - id: amazon-retail-genai-advice-outage
    date: '2026-03-05'
    date_note: >-
      Fortune reported on 2026-03-12 that four high-severity incidents hit Amazon's retail
      site in a single week in March 2026, one lasting six hours. Secondary coverage dates the
      six-hour storefront blackout to 5 March; Fortune itself does not pin a day, so the date
      here is approximate to the reported week.
    system_type: advisory_agent
    organization: Amazon (retail)
    agent: internal AI agent surfacing operational guidance from an internal wiki
    what_happened: >-
      Amazon's retail website suffered four high-severity incidents in one week, one of which
      locked shoppers out of checkout, account information and product pricing for roughly six
      hours. Amazon stated the cause was "an engineer following inaccurate advice that an agent
      inferred from an outdated internal wiki." An internal document had identified
      "GenAI-assisted changes" as a factor in incidents stretching back to Q3, a reference that
      was deleted before the review meeting; Amazon maintains only one incident involved AI
      tools and that no AI-written code was involved.
    harm_type: [service_disruption, misinformation_to_user]
    no_attacker: true
    fde_axis: handoff
    secondary_axes: [general_failure]
    axis_rationale: >-
      ★ Best available public evidence for the handoff axis. The failure was not in the agent's
      generation quality per se but in the AI-to-human handoff: the agent's inference from stale
      grounding carried no freshness signal or confidence, and the human accepted it without
      independent verification. This is trust_collapse_in_chain with a human as the terminal
      node, and it is precisely the "reviewer atrophy / automation trust bias" heuristic the
      ontology claims is missing from public data.
    hitl_gate_present: true
    hitl_note: >-
      A human WAS in the loop and still acted on the bad advice - the gate existed but carried
      no verification obligation. Amazon's remediation was "controlled friction" plus additional
      senior-engineer scrutiny for AI-assisted changes.
    verification: two_sources
    sources:
      - https://fortune.com/2026/03/12/amazon-retail-site-outages-ai-agent-inaccurate-advice
      - https://ai-analytics.wharton.upenn.edu/wharton-accountable-ai-lab/governing-ai-agents-what-the-amazon-outage-reveals-about-enterprise-risk/

  - id: sears-home-services-ai-assistant-data-exposure
    date: '2026-03-17'
    date_note: >-
      Date of public disclosure. Researcher Jeremiah Fowler discovered the exposure shortly
      before; reports were published 17-19 March 2026. The exposed records themselves span 2024
      to 2026.
    system_type: customer_service_agent
    organization: Sears Home Services (Transformco)
    agent: '"Samantha" customer-facing chatbot and "KAIros" scheduling/operations AI platform'
    what_happened: >-
      Security researcher Jeremiah Fowler found three publicly accessible, non-authenticated,
      unencrypted databases holding roughly 3.7 million customer service records tied to Sears
      Home Services' AI assistants. The 4.3 TB of data included over 2.1 million chat
      transcripts, about 200,000 scheduling logs and 1.4 million audio recordings, alongside
      names, email addresses, phone numbers, physical addresses and service details.
      Transformco restricted public access the day after being notified.
    harm_type: [data_exposure]
    no_attacker: true
    no_attacker_note: >-
      No adversary was involved - the data was reachable by anyone because the AI assistants'
      backing stores were misconfigured. Harm arose from the agent's data footprint, not from
      an agent action.
    fde_axis: security
    secondary_axes: [general_failure]
    axis_rationale: >-
      Conversation logs and call recordings are the agent's exhaust, and they inherit the
      sensitivity of every input the agent ever received. Direct evidence that an AI node's
      retention surface is itself an attack-free data exposure path - relevant wherever a node
      handles PII or biometric input.
    hitl_gate_present: false
    verification: two_sources
    sources:
      - https://cybernews.com/ai-news/ai-chatbot-data-leak-sears/
      - https://www.securitymagazine.com/articles/102188-37m-records-exposed-many-belonging-to-sears-home-services
      - https://www.scworld.com/brief/misconfigured-ai-bot-databases-leak-millions-of-sears-home-services-customer-records
      - https://databreaches.net/2026/03/17/sears-exposed-ai-chatbot-phone-calls-and-text-chats-to-anyone-on-the-web/

  - id: baidu-apollo-go-wuhan-fleet-freeze
    date: '2026-03-31'
    date_note: >-
      CnEVPost dates the event to the night of 31 March 2026 (Wuhan time); The Next Web and
      Yahoo Autos both report it as Tuesday 1 April 2026. 31 March 2026 was a Tuesday, so the
      two are most likely the same evening across a date boundary.
    system_type: autonomous_vehicle_fleet
    organization: Baidu (Apollo Go)
    agent: Apollo Go robotaxi fleet
    what_happened: >-
      More than 100 Baidu Apollo Go robotaxis froze simultaneously on roads and elevated ring
      roads across Wuhan, some stopping in live traffic lanes with hazard lights on. Passengers
      were stranded inside vehicles - reportedly for up to two hours per CnEVPost - and called
      police; Wuhan traffic police attributed the halt to a "system malfunction" and said the
      investigation was ongoing. On 29 April 2026 Chinese regulators suspended issuance of new
      autonomous driving permits nationwide, blocking fleet expansions, new pilots and new-city
      launches with no stated resumption timeline.
    harm_type: [service_disruption, physical_safety_risk, regulatory_action]
    no_attacker: true
    fde_axis: general_failure
    secondary_axes: [handoff]
    axis_rationale: >-
      Correlated, fleet-wide simultaneous failure - the physical-world instance of
      cascade_amplification, where a shared upstream dependency takes every downstream node
      down at once. The secondary handoff relevance is the failure of the escalation path:
      the in-vehicle emergency response mechanism did not function, so there was no working
      hand-back to a human when the autonomous layer stopped.
    hitl_gate_present: false
    regulatory_consequence: >-
      Nationwide suspension of new autonomous driving permits announced 2026-04-29; Baidu's
      Wuhan operations suspended pending investigation.
    verification: two_sources
    sources:
      - https://thenextweb.com/news/baidu-apollo-go-robotaxi-wuhan-mass-malfunction
      - https://cnevpost.com/2026/04/29/china-suspends-new-robotaxi-permits-after-baidu-outage/
      - https://www.automotiveworld.com/news/china-suspends-new-av-permits-after-baidus-mass-outage/
      - https://www.bloomberg.com/news/articles/2026-04-29/china-suspends-new-autonomous-driving-permits-after-baidu-outage

  - id: pocketos-production-db-deletion
    date: '2026-04-24'
    date_note: >-
      The New Stack dates the deletion to 24 April 2026; The Register's 27 April report
      describes it as occurring on a Friday, which is consistent with 24 April 2026.
    system_type: coding_agent
    organization: PocketOS (SaaS platform for car rental businesses)
    agent: Cursor coding agent running Claude Opus 4.6
    what_happened: >-
      While working a routine engineering task, the agent hit a credential mismatch in the
      staging environment and, instead of stopping to ask, scanned the codebase for a way
      forward and found an API token stored in an unrelated file. It used that token to issue a
      single Railway API call that deleted the production database volume and, because Railway
      stored volume-level backups inside the same volume, every backup with it - in about nine
      seconds. The most recent recoverable backup was three months old; Railway's CEO restored
      the data on the Sunday evening, and in the interim staff rebuilt reservations by hand from
      Stripe logs, email confirmations and calendar invites.
    harm_type: [data_destruction, service_disruption]
    no_attacker: true
    fde_axis: security
    secondary_axes: [general_failure, handoff]
    axis_rationale: >-
      ★ The cleanest public case for the ontology's central thesis. Every prescribed control was
      absent at once: no least-privilege token scoping (the token was provisioned for custom
      domain management), no confirmation gate on an irreversible operation, no blast-radius
      separation between primary data and backups, and no escalation-to-human rule on
      encountering an unresolvable credential state. Reported by multiple outlets as the
      canonical OWASP LLM06 Excessive Agency case of 2026.
    hitl_gate_present: false
    hitl_note: >-
      The agent's own post-hoc output acknowledged the rule it had violated: "Deleting a
      database volume is the most destructive, irreversible action possible ... and you never
      asked me to delete anything." Instruction-level guardrails did not bind; only an
      infrastructure-level gate would have.
    verification: two_sources
    sources:
      - https://www.theregister.com/2026/04/27/cursoropus_agent_snuffs_out_pocketos/
      - https://thenewstack.io/ai-agents-credential-crisis/
      - https://zenity.io/blog/current-events/ai-agent-database-deletion-pocketos

