survey_statistics:

  cyera_agent_inflicted_damage:
    publisher: Cyera Research
    title: "Agent-Inflicted Damage: Inside the Real-World Failures of Enterprise AI Systems"
    dataset_range: '2023-09 to 2026-05'
    methodology: >-
      7,246 raw incident records drawn from the AI Incident Database (AIID), OECD trackers,
      AI-safety research, security press, community threads and practitioner reports were
      cleaned and clustered with LLM assistance (Claude Opus 4.7), then manually reviewed.
    figures:
      raw_incident_records: 7246
      verified_enterprise_relevant_cases: 344
      no_attacker_cases: 188
      no_attacker_share_of_verified: 0.547
    harm_breakdown:
      access_control_guardrail_bypass_privilege_escalation: 59
      data_and_secrets_exposure: 22
      real_world_damage_total: 137
      real_world_damage_subcategories:
        financial_harm: 19
        deletion_and_code_destruction: 65
        service_and_physical_disruption: 30
        hidden_integrity_failure: 23
    key_claim: >-
      In 188 of 344 verified enterprise-relevant cases an autonomous AI system caused harm in
      production with no attacker anywhere in the chain. The agent was given a task, pursued it,
      and broke something on the way to finishing it.
    named_cases_cited_by_source:
      note: >-
        Listed as cited BY Cyera. PocketOS and the AWS outage are independently verified above;
        the Claude Code GitHub issue numbers below were NOT independently verified in this pass -
        cite them as "reported by Cyera", not as first-hand facts.
        Sears Home Services IS independently verified above.
      items:
        - "PocketOS (April 2026) - coding agent deleted production database and backups"
        - "AWS - internal agent deletion triggered an approximately 13-hour outage"
        - "Claude Code issue #46947 - unauthorized crypto transfer (unverified here)"
        - "Claude Code issue #37155 - unauthorized GCP project creation (unverified here)"
        - "Claude Code issue #32523 - secret key exposure (unverified here)"
        - "Sears Home Services - AI platform exposed 3.7 million customer records"
    sources:
      - https://www.cyera.com/research/agent-inflicted-damage-inside-the-real-world-failures-of-enterprise-ai-systems

  csa_token_security_agent_incidents:
    publisher: Cloud Security Alliance
    commissioned_by: Token Security
    title: "Autonomous but Not Controlled: AI Agent Incidents Now Common in Enterprises"
    published: '2026-04-21'
    methodology: >-
      Online survey of IT and security professionals conducted January 2026; 418 responses.
    figures:
      orgs_with_agent_caused_incident_past_12_months: 0.65
      consequence_data_exposure: 0.61
      consequence_operational_disruption: 0.43
      consequence_unintended_actions_in_business_processes: 0.41
      consequence_financial_loss: 0.35
      consequence_customer_or_internal_service_delays: 0.31
      orgs_that_discovered_previously_unknown_agents: 0.82
      orgs_claiming_high_visibility_into_agents: 0.68
      orgs_with_formal_agent_decommissioning_process: 0.21
      discovered_unknown_agents_multiple_times_in_year: 0.41
      shadow_agents_found_in_internal_automation_or_scripting: 0.51
      shadow_agents_found_in_llm_platforms: 0.47
    autonomy_posture:
      autonomous_for_low_risk_tasks_only: 0.53
      human_in_the_loop_for_most_tasks: 0.24
      fully_autonomous: 0.13
    scope_controls:
      require_human_approval_when_agent_exceeds_scope: 0.38
      require_logging_of_out_of_scope_actions: 0.24
      automatically_block_unauthorized_actions: 0.11
    figure_note: >-
      Two different 41% figures appear in this survey and are routinely conflated in secondary
      coverage: 41% "unintended actions in business processes" (a consequence of an incident)
      and 41% "discovered unknown agents multiple times in the past year" (a discovery
      statistic). Both are recorded above. The CSA press release headline surfaces
      61/43/35; Infosecurity Magazine's write-up carries the 41% and 31% consequence figures.
    fde_relevance: >-
      The scope_controls block is the single most useful number set for this ontology: only 38%
      of organisations require human approval when an agent exceeds its scope, and only 11%
      block unauthorised actions automatically. That is the empirical size of the gap the
      ontology's HITL gating recommendations address.
    sources:
      - https://cloudsecurityalliance.org/press-releases/2026/04/21/new-cloud-security-alliance-survey-reveals-82-of-enterprises-have-unknown-ai-agents-in-their-environments
      - https://www.infosecurity-magazine.com/news/unchecked-ai-agents-cause/
      - https://cloudsecurityalliance.org/artifacts/autonomous-but-not-controlled-ai-agent-incidents-now-common-in-enterprises
      - https://www.token.security/lp/autonomous-but-not-controlled-ai-security-data-report-csa

# =============================================================================
# LEGAL PRECEDENTS (2026) — attribution of agent output to the deploying company
# =============================================================================
# Not incidents, but directly load-bearing for the ontology's liability framing, which
# currently rests on Moffatt v. Air Canada (2024). These are the 2026 successors.

legal_precedents:

  - id: olg-hamm-chatbot-liability
    date: '2026-05-12'
    court: Higher Regional Court of Hamm (OLG Hamm), Germany
    holding: >-
      A company is liable under unfair competition law for false or misleading statements
      generated by its own AI chatbot. The chatbot of a cosmetic surgery provider told users
      that its two managing directors held specialist titles they did not hold. The court held
      that the chatbot is part of the company's own corporate communication, not a "third
      party" whose statements are only attributable in a limited way, and that liability
      attaches even where the company can show it supplied the system with correct data.
    fde_relevance: >-
      Extends Moffatt v. Air Canada from a common-law consumer-contract setting into
      EU/German unfair-competition law, and removes the "we fed it correct data" defence.
      Directly strengthens the liability argument on any node that emits a company-attributable
      statement to an external party.
    verification: two_sources
    sources:
      - https://www.loc.gov/item/global-legal-monitor/2026-06-09/germany-court-rules-chatbot-operators-are-liable-for-ai-hallucinations/
      - https://www.dlapiper.com/en-us/insights/publications/2026/06/german-court-addresses-liability
      - https://www.mme.ch/en/magazine/articles/liability-for-ai-german-court-takes-action

  - id: munich-google-ai-overviews-attribution
    date: '2026-06-12'
    court: Munich, Germany (regional court)
    holding: >-
      An AI-generated search summary is content directly attributable to the operator. Google's
      AI Overview falsely linked two Munich-based publishing companies to scams and subscription
      traps - connections the court noted were not even present in the underlying search results
      the AI was summarising.
    fde_relevance: >-
      Attribution attaches to a generated summary even when it purports to be a derivative of
      third-party source material. Relevant to any summarisation or synthesis node whose output
      reaches an external audience.
    verification: single_source_plus_corroboration
    verification_note: >-
      Confirmed from search-result summaries only; the underlying judgment was not read. Verify
      the court name and docket before quoting this in a client deliverable.
    sources:
      - https://www.asisonline.org/security-management-magazine/latest-news/today-in-security/2026/june/incorrect-AI-liability/
      - https://blogs.law.ox.ac.uk/oblb/blog-post/2026/07/who-speaks-when-algorithm-speaks-german-ruling-ai-overviews

# =============================================================================
# CROSS-CUTTING FINDING — the "no attacker" delta
# =============================================================================

no_attacker_delta:
  observation: >-
    Five of the six incidents in this file, and 188 of 344 verified enterprise cases in the
    Cyera dataset, involved no adversary. The harm came from an agent doing what it was told,
    faster than a human could intervene, with permissions broad enough to make the action
    irreversible.
  implication_for_this_ontology: >-
    The ontology currently routes excessive_agency and permission-scope failures to the
    SECURITY axis (OWASP LLM06, MITRE ATLAS), because that is where the public taxonomies put
    them. But MITRE ATLAS and OWASP both presuppose an adversary. The 2026 evidence base says
    the dominant real-world failure shape for these cells is attack-free. Two options for v0.5,
    for the main session to decide:
      (a) keep the security-axis mapping and add a `threat_model: no_attacker` qualifier to
          affected cells, so mitigations are not mis-scoped to adversarial controls; or
      (b) split excessive_agency out of the security axis into general_failure, and reserve the
          security axis for genuinely adversarial surfaces (prompt injection, poisoning, exfil).
    Option (a) preserves the existing framework cross-mappings and is the lower-risk change.
  supporting_sources:
    - https://www.cyera.com/research/agent-inflicted-damage-inside-the-real-world-failures-of-enterprise-ai-systems

