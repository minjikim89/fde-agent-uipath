# Recorded so that the same leads are not re-investigated or accidentally reintroduced.

dropped_leads:

  - lead: "Air Canada AI booking agent incident, January 2026, ~1,200 passengers"
    claim_as_given: >-
      Air Canada's autonomous booking agent systematically rebooked approximately 1,247
      passengers onto incorrect flights during a Toronto weather disruption in January 2026.
    finding: NOT CONFIRMED - dropped
    reason: >-
      Traced to a single vendor marketing blog (callsphere.ai) listing "early 2026 agentic AI
      disasters". No news coverage, regulator filing, AIID entry or Air Canada statement was
      found. Targeted searching surfaced only the opposite story: Air Canada's Amadeus-based
      AI rebooking reducing recovery time from ~12 hours to ~10 minutes, plus ordinary weather
      and labour disruptions.
    what_is_actually_verified: >-
      The real, citable Air Canada case remains Moffatt v. Air Canada (BC Civil Resolution
      Tribunal, February 2024) - AIID incident 639 - which the ontology already cites at
      N5a_general_failure and loan_N9_general_failure. It is outside this file's date range.
    checked_urls:
      - https://callsphere.ai/blog/ai-agent-failures-biggest-agentic-ai-disasters-early-2026
      - https://incidentdatabase.ai/cite/639/
      - https://amadeus.com/en/blog/articles/how-amadeus-helps-air-canada-rebook-disrupted-passengers-in-just-10-minutes

  - lead: "Klarna AI customer-service refund incident, February 2026"
    claim_as_given: >-
      A February 2026 Klarna AI refund incident highlighting guardrail gaps.
    finding: NOT CONFIRMED - dropped
    reason: >-
      Same single vendor blog as the Air Canada lead. No discrete February 2026 incident was
      found in any independent source.
    what_is_actually_verified: >-
      Klarna's AI support assistant launched February 2024 and handled 2.3 million chats in 30
      days, described by the CEO as equivalent to 700 full-time agents. Quality degraded on
      complex refund, dispute and hardship cases, and in May 2025 Klarna publicly reversed
      course and resumed hiring human agents, with the CEO conceding cost-driven automation
      produced lower quality. That is a 2024-2025 story, outside this file's window, and the
